    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "Bowling Score Calculator",
        "url": "https://bowling-score-calculator.correia95.workers.dev/",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A ten-pin bowling scorer. Tap the number of pins knocked down on each roll and it keeps a live, correctly-computed scoreboard for all ten frames, handling strikes, spares and the tenth frame's bonus balls, including the pin-reset rules for a strike or spare in the final frame. Runs entirely in the browser and saves the current game locally."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is bowling scored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "There are ten frames, each with up to two balls. A strike (all ten pins on the first ball) scores 10 plus the next two balls bowled. A spare (clearing the rack over two balls) scores 10 plus the next one ball. An open frame scores just the pins knocked down in it."
            }
          },
          {
            "@type": "Question",
            "name": "How does scoring work in the 10th frame?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The 10th frame has no next frame to borrow a bonus from, so it awards its bonus balls directly: a spare earns one extra ball and a strike earns two, each bowled against a freshly re-racked set of ten pins."
            }
          },
          {
            "@type": "Question",
            "name": "What is a perfect game?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Twelve strikes in a row — one in each of the first nine frames, plus three in the tenth — for the maximum possible score of 300."
            }
          },
          {
            "@type": "Question",
            "name": "Does this work for candlepin or duckpin bowling?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, this calculator uses standard ten-pin scoring rules (two balls per frame, ten pins). Candlepin and duckpin use a third ball per frame and different scoring conventions."
            }
          }
        ]
      }
    </script>
